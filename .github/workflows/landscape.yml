name: Build Landscape Router OpenWrt

run-name: Landscape ${{ inputs.landscape_version || '0.26.3' }} · OpenWrt ${{ inputs.openwrt_version || '25.12.5' }}

# A build-only workflow: the source repositories are the same as the release
# workflow's, but there are no GUI jobs (the desktop installers are unchanged
# by a landscape image) and nothing is published.  It produces one bundle,
# e5-openwrt-flash-<openwrt>-landscape-<timestamp>-<source>.zip into the run's
# artifacts.  Not triggered by tags.
#
# Three jobs feed the image, each on the runner that suits it: the guarded
# block-mount APK and the patched Landscape daemon are built on their own and
# verified again where they are used, so the image job never silently falls
# back to the upstream daemon, which has no IPv6 on this device's modem
# uplink (docs/LANDSCAPE-V6-NAT-20261021.zh-CN.md in the source repository).
# Two triggers, one input schema: workflow_dispatch takes the same keys as
# workflow_call, so a UI run and a call from landscape-7.2.yml mean the same
# thing.  (YAML anchors are not usable here: Actions does not accept them.)
on:
  workflow_dispatch:
    # Keep in sync with workflow_call below.
    inputs:
      openwrt_version:
        description: OpenWrt release
        type: string
        default: '25.12.5'
        required: true
      landscape_version:
        description: Landscape Router release (the web UI and the redirect handler; the daemon is built from the pinned commit)
        type: string
        default: '0.26.3'
        required: true
      source_ref:
        description: e5-linux branch, tag or commit
        type: string
        default: lts-experiment
        required: true
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit (must carry the Landscape BPF options)
        type: string
        default: e5-6.18
        required: true
      kernel_line:
        description: Kernel line this run is about (names the artifacts; landscape-7.2.yml passes 7.2)
        type: string
        default: '6.18'
      kernel_manifest:
        description: Kernel source manifest (pins the kernel revision and selects the config fragment)
        type: string
        default: upstream/kernel-source-lts-experiment.json
      keep_diagnostics:
        description: Upload build logs and the kernel config even on success
        type: boolean
        default: false
  workflow_call:
    # Keep in sync with workflow_dispatch above.
    inputs:
      openwrt_version:
        description: OpenWrt release
        type: string
        default: '25.12.5'
        required: true
      landscape_version:
        description: Landscape Router release (the web UI and the redirect handler; the daemon is built from the pinned commit)
        type: string
        default: '0.26.3'
        required: true
      source_ref:
        description: e5-linux branch, tag or commit
        type: string
        default: lts-experiment
        required: true
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit (must carry the Landscape BPF options)
        type: string
        default: e5-6.18
        required: true
      kernel_line:
        description: Kernel line this run is about (names the artifacts; landscape-7.2.yml passes 7.2)
        type: string
        default: '6.18'
      kernel_manifest:
        description: Kernel source manifest (pins the kernel revision and selects the config fragment)
        type: string
        default: upstream/kernel-source-lts-experiment.json
      keep_diagnostics:
        description: Upload build logs and the kernel config even on success
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: landscape-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: CST-8
  # The lts-experiment images are built from the maintainer's fork; the kernel
  # needs no experiment branch (e5-6.18 already carries every Landscape BPF
  # option).  Both remain repository variables, so a run against an upstream
  # branch needs no workflow edit.  (The release workflow keeps its own
  # sprd-linux-devs defaults.)
  E5_SOURCE_REPOSITORY: ${{ vars.E5_SOURCE_REPOSITORY || 'Enceka/e5-linux' }}
  E5_KERNEL_REPOSITORY: ${{ vars.E5_KERNEL_REPOSITORY || 'Enceka/linux' }}
  # Names the artifacts of this run; the manifest below decides what is built.
  E5_KERNEL_LINE: ${{ inputs.kernel_line || '6.18' }}
  E5_WRT_VER: ${{ inputs.openwrt_version || '25.12.5' }}
  E5_LANDSCAPE: '1'
  E5_LANDSCAPE_VER: ${{ inputs.landscape_version || '0.26.3' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}
      kernel_sha: ${{ steps.kernel.outputs.commit }}
      build_epoch: ${{ steps.epoch.outputs.epoch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'lts-experiment' }}
          persist-credentials: false
      - name: Resolve the firmware source once
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_KERNEL_REPOSITORY }}
          ref: ${{ inputs.kernel_ref || 'e5-6.18' }}
          persist-credentials: false
      - name: Resolve the kernel source once
        id: kernel
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin the build epoch
        # The kernel and image jobs run on separate runners; both stamp the
        # same bundle, so neither may call date after the split.
        id: epoch
        run: echo "epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

  blockmount:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: e5-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: e5-linux
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Build the guarded block-mount
        run: |
          test "$(uname -m)" = x86_64
          sh openwrt/build-block-mount.sh
      - name: Upload the guarded block-mount APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guarded-block-mount-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/openwrt/block-mount-guarded.apk
            e5-linux/out/openwrt/block-mount-guarded.apk.sha256
            e5-linux/out/openwrt/block-mount-guarded.apk.build-id
          if-no-files-found: error
          compression-level: 0

  daemon:
    # The release's own landscape-webserver drops every IPv6 packet on a WAN
    # link that has no bound IPv6 address, which is this device's modem uplink
    # (docs/LANDSCAPE-V6-NAT-20261021.zh-CN.md in the source repository).  The
    # image therefore ships a daemon built from a pinned upstream commit with
    # the E5's patches, and this job is where that binary comes from.  It needs
    # only the source, so it runs next to the kernel build.
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    defaults:
      run:
        working-directory: e5-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: e5-linux
          persist-credentials: false
      - name: Check the daemon sources
        run: |
          sh -n openwrt/build-landscape.sh openwrt/build-landscape-inner.sh
          test -s openwrt/patches/landscape-v6-nat-without-wan-binding.patch || {
            echo '::error::openwrt/patches has no IPv6 NAT patch'; exit 1; }
          # landscape_version names the release the web UI and the redirect
          # handler come from; the daemon is built from the commit the source
          # pins for that same version.  Bumping one without the other is a
          # mismatch the image job would reject, so fail before the Rust build.
          grep -qx "LS_VER=$E5_LANDSCAPE_VER" openwrt/build-landscape.sh || {
            echo "::error::landscape_version=$E5_LANDSCAPE_VER is not the version openwrt/build-landscape.sh pins"; exit 1; }
          # The build id is what the image job compares its artifact against.
          sh openwrt/build-landscape.sh --build-id
      - name: Restore the crate registry
        # Each run starts on a fresh runner and the Rust build is the slow
        # part; build-landscape.sh takes this directory instead of a Docker
        # volume when E5_LANDSCAPE_CARGO names a path.  The key names the
        # pinned commit, so a new pin restores into the same cache instead of
        # downloading every crate again.
        id: cargo
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: e5-linux/work/landscape-cargo
          key: landscape-cargo-${{ runner.os }}-${{ runner.arch }}-e9f019b5-${{ hashFiles('e5-linux/openwrt/landscape.Dockerfile', 'e5-linux/openwrt/build-landscape.sh') }}
          restore-keys: |
            landscape-cargo-${{ runner.os }}-${{ runner.arch }}-e9f019b5-
            landscape-cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the patched Landscape daemon
        env:
          E5_LANDSCAPE_CARGO: ${{ github.workspace }}/e5-linux/work/landscape-cargo
        run: |
          set -o pipefail
          mkdir -p out/release work/landscape-cargo
          # The first build in a run compiles the Rust tree and pulls the
          # Alpine sysroot; the log is uploaded if it fails.
          sh openwrt/build-landscape.sh 2>&1 | tee out/release/landscape-build.log
      - name: Hand the crate registry back to the runner user
        # The container runs as root and writes root-owned files into the bind
        # mount; actions/cache runs as the runner user and could not read
        # them.
        if: steps.cargo.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" work/landscape-cargo
      - name: Save the crate registry
        if: steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: e5-linux/work/landscape-cargo
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - name: Verify the patched daemon
        run: |
          d=out/openwrt/landscape-webserver-aarch64-static
          for f in "$d" "$d.sha256" "$d.build-id" "$d.patches"; do
            test -s "$f" || { echo "::error::the build left no $f"; exit 1; }
          done
          echo "$(cat "$d.sha256")  $d" | sha256sum -c -
          file "$d" | grep -q 'ARM aarch64' || { echo '::error::the daemon is not an aarch64 ELF'; exit 1; }
          # The build id and the provenance are what the image job cannot tell
          # from the binary: which commit and which patches it came from.
          test "$(cat "$d.build-id")" = "$(sh openwrt/build-landscape.sh --build-id)" || {
            echo '::error::the daemon build id is not the one its inputs produce'; exit 1; }
          grep -qx 'commit e9f019b5ff3b5306a7b336ee36693ca374618480' "$d.patches" || {
            echo '::error::the daemon was not built from the pinned commit'; exit 1; }
          for p in openwrt/patches/landscape-*.patch; do
            grep -qx "patch $(basename "$p") $(sha256sum "$p" | cut -d' ' -f1)" "$d.patches" || {
              echo "::error::the daemon was not built with $p"; exit 1; }
          done
          echo "daemon $(cat "$d.sha256") (build $(cat "$d.build-id"))"
      - name: Upload the patched Landscape daemon
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-daemon-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/openwrt/landscape-webserver-aarch64-static
            e5-linux/out/openwrt/landscape-webserver-aarch64-static.sha256
            e5-linux/out/openwrt/landscape-webserver-aarch64-static.build-id
            e5-linux/out/openwrt/landscape-webserver-aarch64-static.patches
          if-no-files-found: error
          compression-level: 0
      - name: Upload the daemon build log
        if: failure() || inputs.keep_diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-daemon-log-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/out/release/landscape-build.log
          if-no-files-found: ignore

  kernel:
    needs: [resolve, blockmount]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    defaults:
      run:
        working-directory: e5-linux
    steps:
      # Pipeline errors must survive tee, otherwise a later missing archive
      # hides the original build failure.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: e5-linux
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check bootstrap configuration
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          [[ "$INPUTS_URL" == https://* ]] || { echo '::error::Set E5_CI_INPUTS_URL to the HTTPS bootstrap archive URL (docs/RELEASE.md).'; exit 1; }
          [[ "$INPUTS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Set E5_CI_INPUTS_SHA256 to its SHA-256 (docs/RELEASE.md).'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_KERNEL_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.kernel_sha }}
          path: e5-linux/linux-lts-e5
          fetch-depth: 128
          persist-credentials: false
      - name: Validate device repositories
        run: |
          python3 tools/device-layout.py check --system openwrt --model e5
          python3 tools/tests/device-layout.py
          python3 upstream/tests/test_kernel_source.py
          # upstream/kernel-source.json pins the release baseline.  A Landscape
          # build passes its own manifest (E5_KERNEL_MANIFEST below, from
          # kernel_manifest), so the release baseline stays untouched whichever
          # kernel line this run builds; both carry the Landscape BPF options.
          test -z "$(git -C linux-lts-e5 status --porcelain --untracked-files=normal)"
          test "$(git -C linux-lts-e5 rev-parse HEAD)" = "${{ needs.resolve.outputs.kernel_sha }}"
          E5_KERNEL_MANIFEST=${{ inputs.kernel_manifest }} \
            python3 upstream/check-kernel-source.py linux-lts-e5
      - name: Record sources and UTC+8 compile start
        id: start
        env:
          E5_CI_INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
          E5_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci-release.py prepare
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils busybox python3 python3-venv libglib2.0-0t64
      - name: Restore the guarded block-mount APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guarded-block-mount-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/out/openwrt
      - name: Verify the guarded block-mount APK
        run: |
          # The x86 job built this; refuse a file that is not the artifact
          # its own build script verified.
          test -s out/openwrt/block-mount-guarded.apk || { echo '::error::the block-mount artifact is empty'; exit 1; }
          test -s out/openwrt/block-mount-guarded.apk.sha256 || { echo '::error::the block-mount artifact has no SHA-256'; exit 1; }
          test -s out/openwrt/block-mount-guarded.apk.build-id || { echo '::error::the block-mount artifact has no build id'; exit 1; }
          echo "$(cat out/openwrt/block-mount-guarded.apk.sha256)  out/openwrt/block-mount-guarded.apk" | sha256sum -c -
          echo "block-mount build id: $(cat out/openwrt/block-mount-guarded.apk.build-id)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Check the kernel source and the Landscape BPF options
        run: |
          bash -n upstream/build.sh openwrt/build-rootfs.sh openwrt/make-flash-bundle.sh
          # Landscape's documented checklist (landscape.whileaway.dev/zh/intro/requirements):
          # every entry must be present in the fragment this image builds with, which
          # is e5-landscape.config, shared by every Landscape kernel line (the
          # release baseline e5-mainline.config stays untouched).  BPF_JIT_DEFAULT_ON
          # and IPV6_SEG6_BPF are Kconfig defaults
          # (ARCH_WANT_DEFAULT_BPF_JIT and SEG6_LWTUNNEL), so they are checked in the
          # compiled config below instead.
          for o in CONFIG_BPF_SYSCALL=y CONFIG_BPF_JIT=y CONFIG_BPF_UNPRIV_DEFAULT_OFF=y \
                   CONFIG_BPF_LSM=y CONFIG_BPF_EVENTS=y CONFIG_BPF_STREAM_PARSER=y \
                   CONFIG_CGROUP_BPF=y CONFIG_LWTUNNEL_BPF=y CONFIG_NETFILTER_BPF_LINK=y \
                   CONFIG_NETFILTER_XT_MATCH_BPF=m CONFIG_NET_CLS_BPF=y CONFIG_NET_ACT_BPF=m \
                   CONFIG_DEBUG_INFO_BTF=y CONFIG_IPV6_SEG6_LWTUNNEL=y; do
            grep -qx "$o" upstream/e5-landscape.config ||
              { echo "::error::upstream/e5-landscape.config lacks $o, which Landscape requires"; exit 1; }
          done
          grep -qx '# CONFIG_BPF_JIT_ALWAYS_ON is not set' upstream/e5-landscape.config ||
            { echo '::error::BPF_JIT_ALWAYS_ON must stay off (Landscape checklist)'; exit 1; }
          grep -qx '# CONFIG_BPF_PRELOAD is not set' upstream/e5-landscape.config ||
            { echo '::error::BPF_PRELOAD must stay off (Landscape checklist)'; exit 1; }
          grep -qx '# CONFIG_HID_BPF is not set' upstream/e5-landscape.config ||
            { echo '::error::HID_BPF must stay off (Landscape checklist)'; exit 1; }
      - name: Check the OpenWrt landscape integration
        run: |
          python3 tools/tests/landscape-image.py
      - name: Build ARM64 toolchain container
        run: docker build -t e5-mainline-build upstream/
      - name: Compile the release kernel
        env:
          E5_RELEASE: '1'
          E5_KERNEL_MANIFEST: ${{ inputs.kernel_manifest }}
        run: bash upstream/build.sh
      - name: Check the compiled kernel config
        run: |
          for o in CONFIG_BPF_LSM=y CONFIG_BPF_JIT_DEFAULT_ON=y CONFIG_BPF_JIT=y \
                   CONFIG_BPF_SYSCALL=y CONFIG_BPF_EVENTS=y CONFIG_BPF_STREAM_PARSER=y \
                   CONFIG_BPF_UNPRIV_DEFAULT_OFF=y CONFIG_CGROUP_BPF=y \
                   CONFIG_LWTUNNEL_BPF=y CONFIG_NETFILTER_BPF_LINK=y CONFIG_IPV6_SEG6_LWTUNNEL=y \
                   CONFIG_IPV6_SEG6_BPF=y CONFIG_NETFILTER_XT_MATCH_BPF=m \
                   CONFIG_NET_CLS_BPF=y CONFIG_NET_ACT_BPF=m CONFIG_DEBUG_INFO_BTF=y \
                   CONFIG_DEBUG_INFO_BTF_MODULES=y; do
            grep -qx "$o" upstream/out-release/config ||
              { echo "::error::the compiled kernel dropped $o (Landscape needs it)"; exit 1; }
          done
          for o in CONFIG_BPF_JIT_ALWAYS_ON CONFIG_BPF_PRELOAD CONFIG_HID_BPF; do
            grep -qx "# $o is not set" upstream/out-release/config ||
              { echo "::error::$o is set in the compiled kernel (Landscape checklist)"; exit 1; }
          done
      - name: Upload the compiled kernel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-kernel-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/upstream/out-release
          if-no-files-found: error
          compression-level: 0

  image:
    # The daemon job builds and verifies the patched binary on its own; this
    # job only restores it, so a failure there is visible as a missing
    # artifact rather than as an image that quietly carries the release's.
    needs: [resolve, kernel, daemon]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    defaults:
      run:
        working-directory: e5-linux
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: e5-linux
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils busybox python3 python3-venv libglib2.0-0t64
      - name: Restore the guarded block-mount APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guarded-block-mount-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/out/openwrt
      - name: Verify the guarded block-mount APK
        run: |
          test -s out/openwrt/block-mount-guarded.apk || { echo '::error::the block-mount artifact is empty'; exit 1; }
          test -s out/openwrt/block-mount-guarded.apk.sha256 || { echo '::error::the block-mount artifact has no SHA-256'; exit 1; }
          test -s out/openwrt/block-mount-guarded.apk.build-id || { echo '::error::the block-mount artifact has no build id'; exit 1; }
          echo "$(cat out/openwrt/block-mount-guarded.apk.sha256)  out/openwrt/block-mount-guarded.apk" | sha256sum -c -
          echo "block-mount build id: $(cat out/openwrt/block-mount-guarded.apk.build-id)"
      - name: Download the compiled kernel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landscape-kernel-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/upstream/out-release
      - name: Restore the patched Landscape daemon
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: landscape-daemon-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: e5-linux/out/openwrt
      - name: Verify the patched Landscape daemon
        run: |
          d=out/openwrt/landscape-webserver-aarch64-static
          for f in "$d" "$d.sha256" "$d.build-id" "$d.patches"; do
            test -s "$f" || { echo "::error::the daemon artifact has no $f"; exit 1; }
          done
          echo "$(cat "$d.sha256")  $d" | sha256sum -c -
          test "$(cat "$d.build-id")" = "$(sh openwrt/build-landscape.sh --build-id)" || {
            echo '::error::the daemon artifact does not match this source tree'; exit 1; }
          grep -qx 'commit e9f019b5ff3b5306a7b336ee36693ca374618480' "$d.patches" || {
            echo '::error::the daemon artifact was not built from the pinned commit'; exit 1; }
          # The web UI and the redirect handler come from the release named by
          # landscape_version; the daemon comes from the pinned commit.  Mixing
          # the two versions is a mismatch, not a supported combination.
          grep -qx "landscape $E5_LANDSCAPE_VER" "$d.patches" || {
            echo "::error::landscape_version=$E5_LANDSCAPE_VER does not match the daemon: $(head -1 "$d.patches")"; exit 1; }
          echo "daemon $(cat "$d.sha256") (build $(cat "$d.build-id"))"
      - name: Verify the compiled kernel
        run: |
          for f in Image.lk kernel.release modules.tar config; do
            test -s upstream/out-release/$f || { echo "::error::the kernel artifact has no $f"; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Check the OpenWrt landscape integration
        run: |
          bash -n upstream/build.sh openwrt/build-rootfs.sh openwrt/make-flash-bundle.sh
          python3 tools/tests/landscape-image.py
      - name: Build the ARM64 tools container
        # build-rootfs.sh compiles logdw/e5-vibrate/... in it and
        # stage-root-modules.py runs depmod in it; the kernel job's image is
        # on another runner.
        run: docker build -t e5-mainline-build upstream/
      - name: Restore patched OpenWrt packages and Wi-Fi APKs
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
            e5-linux/work/wifi-sae
          key: patched-apk-${{ runner.os }}-${{ runner.arch }}-${{ env.E5_WRT_VER }}-${{ hashFiles('e5-linux/tools/openwrt-package-state.py', 'e5-linux/device/openwrt_device_common/tests/voice-identity.py', 'e5-linux/device/openwrt_device_common/tests/sim-power.py', 'e5-linux/openwrt/build-modemmanager.sh', 'e5-linux/openwrt/build-bluez.sh', 'e5-linux/openwrt/build-hostapd*', 'e5-linux/openwrt/hostapd-*', 'e5-linux/openwrt/wifi-sae-state.py', 'e5-linux/openwrt/patch-hostapd-sae.py', 'e5-linux/openwrt/patches/**', 'e5-linux/device/debian_device_common/patches/modemmanager-*.patch', 'e5-linux/device/debian_device_common/patches/bluez-*.patch') }}
      - name: Compile patched ModemManager, BlueZ and the Wi-Fi APKs
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          bash openwrt/build-modemmanager.sh
          bash openwrt/build-bluez.sh
          # Same e5-openwrt-src tree, so the host tools and cross toolchain built above are reused.
          bash openwrt/build-hostapd.sh
          # This volume belongs to this ephemeral runner. Free it before image assembly.
          docker volume rm e5-openwrt-src
      - name: Save patched packages before image assembly
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
            e5-linux/work/wifi-sae
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Assemble the Landscape flash bundle
        env:
          E5_MAINLINE: '1'
          E5_TOOLS_BUILD_IMAGE: e5-mainline-build
          E5_BUILD_EPOCH: ${{ needs.resolve.outputs.build_epoch }}
          # This build-only workflow has no desktop installer jobs, so the
          # package is source-only on purpose (installer/README.md); the
          # release workflow supplies both GUI artifacts instead.
          OPENWRT_GUI_OPTIONAL: '1'
          # The daemon was restored and verified above: refuse to assemble an
          # image without it instead of shipping the release binary, which
          # has no IPv6 on this device's modem uplink.
          E5_LANDSCAPE_DAEMON_REQUIRED: '1'
        run: |
          set -o pipefail
          mkdir -p out/release
          export E5_INFOSCREEN="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen"
          export E5_INFOSCREEN_PLUGINS="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen-plugins"
          bash openwrt/make-flash-bundle.sh 2>&1 | tee out/release/bundle-build.log
      - name: Verify the Landscape bundle
        run: |
          # The bundle that was just written, not a synthetic one: this is the
          # archive a recipient flashes.  --daemon proves the image carries the
          # patched binary byte for byte, not merely some aarch64 daemon.
          bundle=$(ls out/openwrt/e5-openwrt-*-landscape-*.zip)
          test "$(printf '%s\n' "$bundle" | wc -l)" = 1 || {
            echo '::error::expected exactly one Landscape bundle'; exit 1; }
          python3 tools/tests/landscape-bundle.py \
            --bundle "$bundle" \
            --daemon out/openwrt/landscape-webserver-aarch64-static
      - name: Upload Landscape bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-openwrt-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          # One archive: the ZIP is what people download (Windows Explorer,
          # Linux/macOS extractors and Magisk all take it), so the .tar.gz of the
          # same tree is no longer built.
          path: |
            e5-linux/out/openwrt/e5-openwrt-*-landscape-*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure() || inputs.keep_diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-diagnostics-${{ env.E5_KERNEL_LINE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/release/*.log
            e5-linux/upstream/out-release/config
            e5-linux/out/openwrt/*landscape*.zip.sha256
            e5-linux/out/openwrt/landscape-webserver-aarch64-static.patches
          if-no-files-found: ignore

      - name: Summarize
        run: |
          {
            echo '### Landscape Router bundle'
            echo
            echo "- source: \`${{ needs.resolve.outputs.source_sha }}\`"
            echo "- kernel: \`${{ needs.resolve.outputs.kernel_sha }}\`"
            echo "- Landscape: \`$E5_LANDSCAPE_VER\`"
            echo "- OpenWrt: \`$E5_WRT_VER\`"
            d=out/openwrt/landscape-webserver-aarch64-static
            if [ -s "$d.sha256" ]; then
              echo "- daemon: \`$(cat "$d.sha256")\` (build \`$(cat "$d.build-id")\`, $(sed -n 's/^patch \([^ ]*\) .*/\1/p' "$d.patches" | tr '\n' ' '))"
            fi
            echo
            ls -l out/openwrt/*landscape*.zip 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
