name: Build Landscape Router OpenWrt

run-name: Landscape ${{ inputs.landscape_version || '0.26.3' }} · OpenWrt ${{ inputs.openwrt_version || '25.12.5' }}

# A build-only workflow: the source repositories are the same as the release
# workflow's, but there are no GUI jobs (the desktop installers are unchanged
# by a landscape image) and nothing is published.  It produces one bundle,
# e5-openwrt-flash-<openwrt>-landscape-<timestamp>-<source>.tar.gz, plus its
# .zip, into the run's artifacts.  Not triggered by tags.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release
        default: '25.12.5'
        required: true
      landscape_version:
        description: Landscape Router release (pinned by SHA-256 in the source)
        default: '0.26.3'
        required: true
      source_ref:
        description: e5-linux branch, tag or commit
        default: e5-7.2-experiment
        required: true
      kernel_ref:
        description: linux-lts-e5 branch, tag or commit (must carry the Landscape BPF options)
        default: e5-7.2-experiment
        required: true
      keep_diagnostics:
        description: Upload build logs and the kernel config even on success
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: landscape-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: CST-8
  # The 7.2 experiment lives in the maintainer's forks, so those are the
  # defaults here; both remain repository variables, so a run against an
  # upstream branch needs no workflow edit.  (The release workflow keeps its
  # own sprd-linux-devs defaults.)
  E5_SOURCE_REPOSITORY: ${{ vars.E5_SOURCE_REPOSITORY || 'Enceka/e5-linux' }}
  E5_KERNEL_REPOSITORY: ${{ vars.E5_KERNEL_REPOSITORY || 'Enceka/linux' }}
  E5_WRT_VER: ${{ inputs.openwrt_version || '25.12.5' }}
  E5_LANDSCAPE: '1'
  E5_LANDSCAPE_VER: ${{ inputs.landscape_version || '0.26.3' }}

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.commit }}
      kernel_sha: ${{ steps.kernel.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ inputs.source_ref || 'e5-7.2-experiment' }}
          persist-credentials: false
      - name: Resolve the firmware source once
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_KERNEL_REPOSITORY }}
          ref: ${{ inputs.kernel_ref || 'e5-7.2-experiment' }}
          persist-credentials: false
      - name: Resolve the kernel source once
        id: kernel
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    defaults:
      run:
        working-directory: e5-linux
    steps:
      # Pipeline errors must survive tee, otherwise a later missing archive
      # hides the original build failure.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_SOURCE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.source_sha }}
          path: e5-linux
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check bootstrap configuration
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          [[ "$INPUTS_URL" == https://* ]] || { echo '::error::Set E5_CI_INPUTS_URL to the HTTPS bootstrap archive URL (docs/RELEASE.md).'; exit 1; }
          [[ "$INPUTS_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo '::error::Set E5_CI_INPUTS_SHA256 to its SHA-256 (docs/RELEASE.md).'; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ env.E5_KERNEL_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.kernel_sha }}
          path: e5-linux/linux-lts-e5
          fetch-depth: 128
          persist-credentials: false
      - name: Validate device repositories
        run: |
          python3 tools/device-layout.py check --system openwrt --model e5
          python3 tools/tests/device-layout.py
          python3 upstream/tests/test_kernel_source.py
          # upstream/kernel-source.json pins the 6.18 release baseline; the
          # 7.2 experiment shares no history with it, so this build uses
          # upstream/kernel-source-7.2.json (E5_KERNEL_MANIFEST below).
          test -z "$(git -C linux-lts-e5 status --porcelain --untracked-files=normal)"
          test "$(git -C linux-lts-e5 rev-parse HEAD)" = "${{ needs.resolve.outputs.kernel_sha }}"
          E5_KERNEL_MANIFEST=upstream/kernel-source-7.2.json \
            python3 upstream/check-kernel-source.py linux-lts-e5
      - name: Record sources and UTC+8 compile start
        id: start
        env:
          E5_CI_INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
          E5_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 tools/ci-release.py prepare
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 e2fsprogs binutils busybox python3 python3-venv libglib2.0-0t64
      - name: Set up pinned x86 container emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v9.2.2@sha256:1b804311fe87047a4c96d38b4b3ef6f62fca8cd125265917a9e3dc3c996c39e6
          platforms: amd64
          reset: true
      - name: Prepare and verify the x86 SDK container
        run: |
          docker build --platform linux/amd64 -t e5-block-sdk-build -f openwrt/block-mount.Dockerfile openwrt
          docker run --rm --platform linux/amd64 e5-block-sdk-build sh -ec 'test "$(uname -m)" = x86_64; cc --version; python3 --version'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify bootstrap inputs
        env:
          INPUTS_URL: ${{ vars.E5_CI_INPUTS_URL }}
          INPUTS_SHA256: ${{ vars.E5_CI_INPUTS_SHA256 }}
        run: |
          curl --fail --location --retry 5 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ci-inputs.tar.gz" "$INPUTS_URL"
          python3 tools/ci-inputs.py restore "$RUNNER_TEMP/ci-inputs.tar.gz" --sha256 "$INPUTS_SHA256"
      - name: Check the kernel source and the Landscape BPF options
        run: |
          bash -n upstream/build.sh openwrt/build-rootfs.sh openwrt/make-flash-bundle.sh
          # Landscape's documented checklist (landscape.whileaway.dev/zh/intro/requirements):
          # every entry must be present in the E5 mainline config.  BPF_JIT_DEFAULT_ON and
          # IPV6_SEG6_BPF are Kconfig defaults (ARCH_WANT_DEFAULT_BPF_JIT and SEG6_LWTUNNEL),
          # so they are checked in the compiled config below instead.
          for o in CONFIG_BPF_SYSCALL=y CONFIG_BPF_JIT=y CONFIG_BPF_UNPRIV_DEFAULT_OFF=y \
                   CONFIG_BPF_LSM=y CONFIG_BPF_EVENTS=y CONFIG_BPF_STREAM_PARSER=y \
                   CONFIG_CGROUP_BPF=y CONFIG_LWTUNNEL_BPF=y CONFIG_NETFILTER_BPF_LINK=y \
                   CONFIG_NETFILTER_XT_MATCH_BPF=m CONFIG_NET_CLS_BPF=y CONFIG_NET_ACT_BPF=m \
                   CONFIG_DEBUG_INFO_BTF=y CONFIG_IPV6_SEG6_LWTUNNEL=y; do
            grep -qx "$o" upstream/e5-mainline.config ||
              { echo "::error::upstream/e5-mainline.config lacks $o, which Landscape requires"; exit 1; }
          done
          grep -qx '# CONFIG_BPF_JIT_ALWAYS_ON is not set' upstream/e5-mainline.config ||
            { echo '::error::BPF_JIT_ALWAYS_ON must stay off (Landscape checklist)'; exit 1; }
          grep -qx '# CONFIG_BPF_PRELOAD is not set' upstream/e5-mainline.config ||
            { echo '::error::BPF_PRELOAD must stay off (Landscape checklist)'; exit 1; }
          grep -qx '# CONFIG_HID_BPF is not set' upstream/e5-mainline.config ||
            { echo '::error::HID_BPF must stay off (Landscape checklist)'; exit 1; }
      - name: Check the OpenWrt landscape integration
        run: |
          python3 tools/tests/landscape-image.py
      - name: Build ARM64 toolchain container
        run: docker build -t e5-mainline-build upstream/
      - name: Compile the release kernel
        env:
          E5_RELEASE: '1'
          E5_KERNEL_MANIFEST: upstream/kernel-source-7.2.json
        run: bash upstream/build.sh
      - name: Check the compiled kernel config
        run: |
          for o in CONFIG_BPF_LSM=y CONFIG_BPF_JIT_DEFAULT_ON=y CONFIG_BPF_JIT=y \
                   CONFIG_BPF_SYSCALL=y CONFIG_BPF_EVENTS=y CONFIG_BPF_STREAM_PARSER=y \
                   CONFIG_BPF_UNPRIV_DEFAULT_OFF=y CONFIG_CGROUP_BPF=y \
                   CONFIG_LWTUNNEL_BPF=y CONFIG_NETFILTER_BPF_LINK=y CONFIG_IPV6_SEG6_LWTUNNEL=y \
                   CONFIG_IPV6_SEG6_BPF=y CONFIG_NETFILTER_XT_MATCH_BPF=m \
                   CONFIG_NET_CLS_BPF=y CONFIG_NET_ACT_BPF=m CONFIG_DEBUG_INFO_BTF=y \
                   CONFIG_DEBUG_INFO_BTF_MODULES=y; do
            grep -qx "$o" upstream/out-release/config ||
              { echo "::error::the compiled kernel dropped $o (Landscape needs it)"; exit 1; }
          done
          for o in CONFIG_BPF_JIT_ALWAYS_ON CONFIG_BPF_PRELOAD CONFIG_HID_BPF; do
            grep -qx "# $o is not set" upstream/out-release/config ||
              { echo "::error::$o is set in the compiled kernel (Landscape checklist)"; exit 1; }
          done
      - name: Restore patched OpenWrt packages and Wi-Fi APKs
        id: packages
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
            e5-linux/work/wifi-sae
          key: patched-apk-${{ runner.os }}-${{ runner.arch }}-${{ env.E5_WRT_VER }}-${{ hashFiles('e5-linux/tools/openwrt-package-state.py', 'e5-linux/device/openwrt_device_common/tests/voice-identity.py', 'e5-linux/device/openwrt_device_common/tests/sim-power.py', 'e5-linux/openwrt/build-modemmanager.sh', 'e5-linux/openwrt/build-bluez.sh', 'e5-linux/openwrt/build-hostapd*', 'e5-linux/openwrt/hostapd-*', 'e5-linux/openwrt/wifi-sae-state.py', 'e5-linux/openwrt/patch-hostapd-sae.py', 'e5-linux/openwrt/patches/**', 'e5-linux/device/debian_device_common/patches/modemmanager-*.patch', 'e5-linux/device/debian_device_common/patches/bluez-*.patch') }}
      - name: Compile patched ModemManager, BlueZ and the Wi-Fi APKs
        if: steps.packages.outputs.cache-hit != 'true'
        run: |
          bash openwrt/build-modemmanager.sh
          bash openwrt/build-bluez.sh
          # Same e5-openwrt-src tree, so the host tools and cross toolchain built above are reused.
          bash openwrt/build-hostapd.sh
          # This volume belongs to this ephemeral runner. Free it before image assembly.
          docker volume rm e5-openwrt-src
      - name: Save patched packages before image assembly
        if: steps.packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            e5-linux/out/openwrt/*.apk
            e5-linux/out/openwrt/e5-modemmanager-build.json
            e5-linux/work/wifi-sae
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Build guarded block-mount
        run: |
          sh openwrt/build-block-mount.sh
      - name: Assemble the Landscape flash bundle
        env:
          E5_MAINLINE: '1'
          E5_TOOLS_BUILD_IMAGE: e5-mainline-build
        run: |
          set -o pipefail
          export E5_INFOSCREEN="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen"
          export E5_INFOSCREEN_PLUGINS="$GITHUB_WORKSPACE/e5-linux/ci/infoscreen-plugins"
          bash openwrt/make-flash-bundle.sh 2>&1 | tee out/release/bundle-build.log
      - name: Verify the Landscape bundle
        run: |
          python3 tools/tests/landscape-bundle.py
      - name: Upload Landscape bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-openwrt-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/openwrt/e5-openwrt-*-landscape-*.tar.gz
            e5-linux/out/openwrt/e5-openwrt-*-landscape-*.zip
          compression-level: 0
          if-no-files-found: error
      - name: Upload build diagnostics
        if: failure() || inputs.keep_diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: landscape-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e5-linux/out/release/*.log
            e5-linux/upstream/out-release/config
            e5-linux/out/openwrt/*landscape*.tar.gz.sha256
          if-no-files-found: ignore

      - name: Summarize
        run: |
          {
            echo '### Landscape Router bundle'
            echo
            echo "- source: \`${{ needs.resolve.outputs.source_sha }}\`"
            echo "- kernel: \`${{ needs.resolve.outputs.kernel_sha }}\`"
            echo "- Landscape: \`$E5_LANDSCAPE_VER\`"
            echo "- OpenWrt: \`$E5_WRT_VER\`"
            echo
            ls -l out/openwrt/*landscape*.tar.gz out/openwrt/*landscape*.zip 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
