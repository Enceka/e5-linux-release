# The 7.2 entry point: the same Landscape bundle as landscape.yml, but built
# from the source repository's 7.2 experiment branch, the e5-7.2-experiment
# kernel branch and the 7.2 manifest (upstream/kernel-source-7.2.json), which
# pins the kernel revision and selects the shared Landscape config fragment.
#
# This file is a caller only.  The build logic lives in landscape.yml and is
# not duplicated here: a change there applies to both kernel lines.
name: Build Landscape Router OpenWrt (7.2 kernel)

run-name: Landscape ${{ inputs.landscape_version || '0.26.3' }} · OpenWrt ${{ inputs.openwrt_version || '25.12.5' }} · kernel 7.2

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: OpenWrt release
        type: string
        default: '25.12.5'
        required: true
      landscape_version:
        description: Landscape Router release (the web UI and the redirect handler; the daemon is built from the pinned commit)
        type: string
        default: '0.26.3'
        required: true
      keep_diagnostics:
        description: Upload build logs and the kernel config even on success
        type: boolean
        default: false

permissions:
  contents: read

# Its own group: the two entry points build different kernels from different
# branches, so they must never cancel each other.
concurrency:
  group: landscape-7.2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  landscape:
    uses: ./.github/workflows/landscape.yml
    with:
      source_ref: e5-7.2-experiment
      kernel_ref: e5-7.2-experiment
      kernel_line: '7.2'
      kernel_manifest: upstream/kernel-source-7.2.json
      openwrt_version: ${{ inputs.openwrt_version || '25.12.5' }}
      landscape_version: ${{ inputs.landscape_version || '0.26.3' }}
      keep_diagnostics: ${{ inputs.keep_diagnostics || false }}
